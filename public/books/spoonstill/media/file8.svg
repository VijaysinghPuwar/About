<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Step 1: cover-fit -->
  <text x="20" y="28" font-weight="bold" fill="#1b1d21">1. cover-fit: 4000x3000 becomes 5760x4320</text>
  <rect x="40" y="48" width="288" height="216" fill="#e9eef4" stroke="#7a8696" stroke-dasharray="5,4"/>
  <text x="48" y="66" fill="#4a4f57" font-size="11">scaled photo 5760x4320</text>
  <rect x="40" y="75" width="288" height="162" fill="none" stroke="#2f5d8a" stroke-width="2.5"/>
  <text x="48" y="230" fill="#2f5d8a" font-size="11">crop=5760:3240 keeps the centre</text>
  <text x="340" y="70" fill="#4a4f57" font-size="11.5">540 rows cut</text>
  <text x="340" y="86" fill="#4a4f57" font-size="11.5">top and bottom</text>
  <!-- Step 2: windows -->
  <text x="460" y="28" font-weight="bold" fill="#1b1d21">2. zoompan moves a window over 5760x3240</text>
  <rect x="470" y="60" width="384" height="216" fill="#eef4fa" stroke="#2f5d8a" stroke-width="2.5"/>
  <text x="470" y="52" fill="#2f5d8a" font-size="11">frame 0: zoom 1.0, window = the whole canvas (outer blue)</text>
  <rect x="479" y="65" width="366" height="206" fill="none" stroke="#a3561a" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="560" y="262" fill="#a3561a" font-size="11">frame 55: zoom 1.0496</text>
  <rect x="487.5" y="69.8" width="349" height="196.4" fill="none" stroke="#3d7a3a" stroke-width="2.5"/>
  <text x="560" y="160" fill="#3d7a3a" font-size="12">frame 111: zoom 1.10, window 5236x2945</text>
  <text x="560" y="176" fill="#3d7a3a" font-size="12">x = 0.5 x (iw - iw/zoom) = 262</text>
  <!-- Step 3 -->
  <text x="20" y="320" font-weight="bold" fill="#1b1d21">3. every window is resampled to the output size (s=1920x1080), one frame per step</text>
  <g transform="translate(40,340)">
    <rect width="192" height="108" fill="#eef4fa" stroke="#2f5d8a" stroke-width="2"/>
    <text x="8" y="126" fill="#4a4f57" font-size="11">frame 0 (1920x1080)</text>
    <rect x="232" width="192" height="108" fill="#f6efe7" stroke="#a3561a" stroke-width="2"/>
    <text x="240" y="126" fill="#4a4f57" font-size="11">frame 55</text>
    <rect x="464" width="192" height="108" fill="#edf6ef" stroke="#3d7a3a" stroke-width="2"/>
    <text x="472" y="126" fill="#4a4f57" font-size="11">frame 111 (last)</text>
    <text x="680" y="40" fill="#1b1d21" font-size="12">Same output size,</text>
    <text x="680" y="56" fill="#1b1d21" font-size="12">smaller window each</text>
    <text x="680" y="72" fill="#1b1d21" font-size="12">frame: the picture</text>
    <text x="680" y="88" fill="#1b1d21" font-size="12">appears to move in.</text>
  </g>
  <text x="20" y="505" fill="#6b717a" font-size="11">Numbers from the pinned test case in crates/spoonstill-core/src/motion.rs: 4000x3000 still, 1920x1080 at 30 fps, ZoomIn 0.10 at Center, 112 frames. Not to scale.</text>
</svg>
